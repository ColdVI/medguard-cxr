project:
  name: medguard-cxr
  phase: 3
  description: "RSNA Pneumonia Detection Challenge 2018 localization configuration."

seed: 2026

data:
  dataset: rsna-pneumonia-detection
  root: data/rsna
  image_dir: stage_2_train_images
  labels_csv: stage_2_train_labels.csv
  detailed_class_info_csv: stage_2_detailed_class_info.csv
  manifest_csv:
  include_negative: true
  labels:
    - Lung Opacity

split:
  eval: test
  val_fraction: 0.10
  test_fraction: 0.10
  note: >-
    RSNA public train labels are split deterministically by patientId into
    train/val/test; hidden Kaggle test labels are not used. cam_threshold below
    was selected on the val split via results/sweep/ and is now read once on
    test as the confirmatory run; do not re-tune cam_threshold from the test
    result.

preprocessing:
  image_size: 224
  channels: 3
  normalization:
    active: imagenet
    imagenet_mean: [0.485, 0.456, 0.406]
    imagenet_std: [0.229, 0.224, 0.225]

gradcam:
  method: gradcam
  secondary_method: gradcam_plus_plus
  target_layer: last_conv_before_global_average_pooling
  confidence_gate: 0.70
  skip_abstained: true
  cam_threshold: 0.80
  target_class_mapping:
    Pneumonia:
      - Lung Opacity
  postprocessing:
    smoothing_sigma: 0.0
    border_suppression_fraction: 0.0
    border_artifact_fraction: 0.05

localization:
  iou_threshold: 0.50
  evaluation:
    max_samples: 1024
    overlay_count: 20
  metrics:
    - mean_iou
    - map_at_0_5
    - pointing_game_accuracy
  outputs:
    metrics_json: results/grounding_rsna_eval.json
    overlay_dir: results/overlays/rsna

safety:
  note: "RSNA overlays are research-only engineering artifacts; lung-opacity boxes are not clinically validated evidence."

status:
  active: true
  note: >-
    Localization numbers are only meaningful when a non-smoke NIH checkpoint is
    evaluated against real RSNA images and provider boxes, with calibration fitted
    on real validation logits. Reports produced from a smoke checkpoint carry
    WARNING_DO_NOT_USE and must not be quoted as model quality.
